<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Title, description, canonical và og/twitter title|description|url được render
    động theo TỪNG trang trong React 19 (xem src/components/Seo.tsx) để mỗi trang
    có metadata riêng. Cố tình KHÔNG đặt <title>/description tĩnh ở đây để tránh
    trùng lặp thẻ trong <head> (Google render JS nên vẫn nhận đủ metadata).
  -->
  <meta name="keywords"
    content="gõ 10 ngón tiếng việt, luyện gõ 10 ngón, gõ 10 ngón, typing kid, gõ mười ngón, học gõ phím, telex, vni, luyện gõ nhanh" />
  <meta name="author" content="Kamy Tech" />

  <!-- Open Graph / Twitter: chỉ giữ thuộc tính dùng chung cho mọi trang -->
  <meta property="og:type" content="website" />
  <meta property="og:image" content="https://type.scala.vn/og-image.png" />
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:image" content="https://type.scala.vn/og-image.png" />

  <meta name="theme-color" content="#58a6ff" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "Typing Kid VN",
    "operatingSystem": "Web",
    "applicationCategory": "EducationalApplication",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "VND"
    },
    "description": "Phần mềm luyện gõ 10 ngón tiếng việt miễn phí, học gõ mười ngón theo kiểu Telex và VNI."
  }
  </script>
  <!-- FAQ Structured Data for AI Overviews -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "Làm thế nào để gõ 10 ngón tiếng việt nhanh nhất?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Để gõ 10 ngón tiếng việt nhanh nhất, bạn cần luyện tập đặt tay đúng vị trí trên hàng phím cơ sở (ASDF - JKL;), gõ không nhìn bàn phím và sử dụng các phần mềm luyện tập như Typing Kid VN để làm quen với kiểu gõ Telex hoặc VNI."
        }
      },
      {
        "@type": "Question",
        "name": "Học gõ 10 ngón tiếng việt có khó không?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Hoàn toàn không khó nếu bạn luyện tập đúng phương pháp. Typing Kid VN cung cấp các bài học từ cơ bản đến nâng cao giúp bạn làm quen với từng hàng phím một cách tự nhiên và thú vị."
        }
      },
      {
        "@type": "Question",
        "name": "Nên dùng kiểu gõ Telex hay VNI?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Telex phổ biến hơn và giúp gõ nhanh hơn trên các thiết bị hiện đại vì không cần di chuyển tay lên hàng phím số. Tuy nhiên, VNI vẫn là lựa chọn tốt nếu bạn đã quen với việc gõ số."
        }
      }
    ]
  }
  </script>

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
